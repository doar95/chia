<!DOCTYPE html>
<html lang="es" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chía, memoria y porvenir</title>
<meta name="description" content="Mapa interactivo de la historia y los planes de Chía, Cundinamarca, construido solo con documentos oficiales. Población, hacienda, agua, ordenamiento y obras.">
<meta property="og:type" content="website">
<meta property="og:title" content="Chía, memoria y porvenir">
<meta property="og:description" content="Cinco siglos de un municipio de la Sabana contados con documentos oficiales. Mapa interactivo con población, hacienda, agua, planes y obras.">
<meta property="og:url" content="https://doar95.github.io/chia/">
<meta property="og:image" content="https://doar95.github.io/chia/vista.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:locale" content="es_CO">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://doar95.github.io/chia/vista.png">
<meta name="theme-color" content="#0a1420">
<link rel="icon" href="icono.svg" type="image/svg+xml">
<link rel="stylesheet" href="vendor/maplibre-gl.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --noche:#0a1420; --panel:#0f1c2bf2; --linea:#2a3b50; --luna:#efe9dc; --tenue:#9fb0c3;
  --oro:#e3b04b; --agua:#63b8c4; --teja:#dd7a55; --sabana:#8fb47a; --lila:#b79ad6;
  --serif:"Fraunces",Georgia,"Songti SC","Noto Serif SC",serif;
  --sans:"Inter",system-ui,-apple-system,"Segoe UI","Noto Sans Arabic","PingFang SC","Microsoft YaHei",sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--noche);color:var(--luna);font-family:var(--sans);font-size:15px;line-height:1.5}
#map{position:fixed;inset:0}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--oro)}
.cab{position:fixed;inset-block-start:0;inset-inline:0;display:flex;justify-content:space-between;align-items:flex-start;gap:16px;padding:18px 22px;pointer-events:none;z-index:5;background:linear-gradient(#0a1420e6,#0a142000)}
.cab>*{pointer-events:auto}
h1{font-family:var(--serif);font-weight:600;font-size:clamp(22px,2.6vw,34px);margin:0;letter-spacing:.2px}
.sub{color:var(--tenue);max-width:46ch;margin:2px 0 0;font-size:14px}
.acc{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end;align-items:center}
.pld{border:1px solid var(--linea);background:#0f1c2bcc;border-radius:999px;padding:7px 14px;font-size:13px;backdrop-filter:blur(6px)}
.pld:hover{border-color:var(--oro)}
.idi{display:flex;border:1px solid var(--linea);border-radius:999px;overflow:hidden;background:#0f1c2bcc}
.idi button{border:0;background:none;padding:7px 11px;font-size:13px;color:var(--tenue)}
.idi button[aria-pressed=true]{background:var(--oro);color:#1a1405;font-weight:600}
.lat{position:fixed;inset-block:118px 128px;inset-inline-start:22px;width:min(410px,calc(100vw - 44px));background:var(--panel);border:1px solid var(--linea);border-radius:16px;display:flex;flex-direction:column;z-index:4;backdrop-filter:blur(8px);overflow:hidden}
.caps{scrollbar-width:none;display:flex;gap:1px;padding:10px 8px;border-bottom:1px solid var(--linea);overflow-x:auto}
.caps button{border:0;background:none;padding:6px 8px;border-radius:999px;color:var(--tenue);white-space:nowrap;font-size:13px}
.caps button[aria-selected=true]{background:#1c2e44;color:var(--luna);font-weight:600}
.cont{padding:16px 18px 20px;overflow-y:auto;flex:1}
.cont h2{font-family:var(--serif);font-weight:600;font-size:19px;margin:18px 0 6px}
.cont h2:first-child{margin-top:0}
.cont p{margin:0 0 10px;color:#dcd6c9}
.nota{font-size:13px;color:var(--tenue)}
.ev{border-inline-start:2px solid var(--linea);padding:2px 0 14px 14px;padding-inline-start:14px;position:relative;opacity:.38;transition:opacity .3s;cursor:pointer}
.ev::before{content:"";position:absolute;inset-inline-start:-6px;top:6px;width:10px;height:10px;border-radius:50%;background:var(--linea)}
.ev.on{opacity:1}.ev.on::before{background:var(--oro)}
.ev.act{border-inline-start-color:var(--oro)}
.ev .a{font-size:12.5px;color:var(--oro);font-weight:600;letter-spacing:.4px}
.ev h3{font-family:var(--serif);font-size:16.5px;margin:1px 0 3px;font-weight:600}
.ev p{font-size:14px;margin:0 0 6px}
.fts{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 12px}
.ft{font-size:12.5px;border:1px solid var(--linea);border-radius:6px;padding:2px 7px;color:var(--tenue);text-decoration:none;display:inline-flex;gap:6px;align-items:center}
.ft:hover{border-color:var(--oro);color:var(--luna)}
.ft b{font-weight:600;font-size:10px;text-transform:uppercase;letter-spacing:.5px}
.t-of b{color:var(--sabana)}.t-ju b{color:var(--agua)}.t-ac b{color:var(--lila)}.t-pr b{color:var(--teja)}
.tar{border:1px solid var(--linea);border-radius:12px;padding:12px 14px;margin:0 0 10px;cursor:pointer;background:#12213299}
.tar:hover,.tar.act{border-color:var(--agua)}
.tar h3{font-family:var(--serif);font-size:16.5px;margin:0 0 4px;font-weight:600}
.tar p{font-size:14px;margin:0 0 6px}
table{width:100%;border-collapse:collapse;font-size:13px;margin:4px 0 8px}
th,td{padding:4px 6px;text-align:end;border-bottom:1px solid #22344a}
th:first-child,td:first-child{text-align:start}
th{color:var(--tenue);font-weight:500}
svg text{font-family:var(--sans);fill:var(--tenue);font-size:11.5px}
.ley{display:flex;flex-wrap:wrap;gap:10px;font-size:13px;color:var(--tenue);margin:2px 0 8px}
.ley i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-inline-end:5px;vertical-align:-1px}
.anio{position:fixed;inset-block-start:112px;inset-inline-end:26px;text-align:end;z-index:3;pointer-events:none}
.anio .n{font-family:var(--serif);font-size:clamp(40px,6vw,76px);line-height:1;font-weight:400}
.anio .p{font-size:clamp(20px,2.4vw,30px);font-family:var(--serif);color:var(--oro);margin-top:6px}
.anio .l{font-size:14px;color:var(--tenue)}
.tiempo{position:fixed;inset-block-end:0;inset-inline:0;padding:14px 22px 18px;z-index:5;background:linear-gradient(#0a142000,#0a1420f2 45%);display:flex;gap:14px;align-items:flex-end}
.tiempo .bt{width:42px;height:42px;border-radius:50%;border:1px solid var(--oro);background:#0f1c2b;color:var(--oro);font-size:15px;flex:none}
.pista{flex:1;position:relative;height:58px;direction:ltr}
.pista input{position:absolute;inset-inline:0;bottom:6px;width:100%;margin:0;accent-color:var(--oro);background:none}
.marcas{position:absolute;inset-inline:8px;bottom:28px;height:26px}
.marcas i{position:absolute;bottom:0;width:2px;height:10px;background:var(--tenue);opacity:.6;transform:translateX(-1px)}
.marcas span{position:absolute;bottom:13px;font-size:13px;color:var(--tenue);transform:translateX(-50%)}
.leym{position:fixed;inset-block-end:92px;inset-inline-end:22px;z-index:3;font-size:14.5px;line-height:1.45;color:var(--tenue);background:#0f1c2bcc;border:1px solid var(--linea);border-radius:10px;padding:12px 16px;max-width:330px}
.leym div{display:flex;align-items:center;gap:10px;margin:4px 0}
.leym i{width:22px;height:0;border-top:3px solid;flex:none}
.etq{font-size:13px;color:#cfd8e3;text-shadow:0 0 4px #0a1420,0 0 4px #0a1420;white-space:nowrap;pointer-events:none}
.etq.c{font-family:var(--serif);font-size:18px;color:var(--luna);font-weight:600}
.etq.v{color:var(--oro);font-size:12.5px}
.modal{position:fixed;inset:0;background:#060c14d9;z-index:20;display:none;align-items:center;justify-content:center;padding:20px}
.modal.ab{display:flex}
.modal .caja{background:#0f1c2b;border:1px solid var(--linea);border-radius:16px;max-width:760px;width:100%;max-height:86vh;overflow:auto;padding:24px 28px}
.modal h2{font-family:var(--serif);margin:0 0 10px;font-size:24px}
.modal h3{font-family:var(--serif);margin:18px 0 6px;font-size:17px}
.modal li{margin:4px 0;color:#dcd6c9}
.modal .lf{list-style:none;padding:0}.modal .lf li{margin:6px 0}
.rec{position:fixed;inset:0;z-index:15;display:none;pointer-events:none}
.rec.ab{display:block}
.rec .vel{position:absolute;inset:0;background:radial-gradient(ellipse at center,#0a142000 30%,#0a1420cc 100%)}
.rec .txt{position:absolute;inset-inline:0;bottom:17vh;text-align:center;padding:0 20px}
.rec .txt h2{font-family:var(--serif);font-size:clamp(34px,6vw,72px);margin:0;font-weight:600;text-shadow:0 2px 24px #0a1420}
.rec .txt p{font-size:clamp(16px,2vw,22px);color:var(--luna);margin:8px 0 0;text-shadow:0 2px 12px #0a1420}
.rec .txt>*{animation:sube .9s both}
@keyframes sube{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.rec .ctl{position:absolute;inset-inline:0;bottom:6vh;display:flex;gap:10px;justify-content:center;pointer-events:auto}
.rec .bar{position:absolute;inset-inline:0;bottom:0;height:3px;background:#22344a}
.rec .bar i{display:block;height:100%;background:var(--oro);width:0}
body.enrec .lat,body.enrec .tiempo,body.enrec .leym,body.enrec .anio,body.enrec .cab{opacity:0;pointer-events:none}
.lat,.tiempo,.leym,.anio,.cab{transition:opacity .6s}
.trad{font-size:12px;color:var(--tenue);border:1px dashed var(--linea);border-radius:8px;padding:6px 10px;margin:0 0 12px}
.maplibregl-ctrl-attrib{font-size:10px}
.maplibregl-ctrl-top-right{top:268px;right:16px}
.maplibregl-ctrl-bottom-left{bottom:74px;left:440px}
[dir=rtl] .maplibregl-ctrl-bottom-left{left:auto;right:440px}
[dir=rtl] .maplibregl-ctrl-top-right{right:auto;left:16px}
body.enrec .maplibregl-control-container{opacity:0}
@media (max-width:820px){
  .cab{flex-direction:column;padding:12px 14px;gap:8px}.acc{justify-content:flex-start}
  .sub{display:none}
  .lat{inset-block:auto 96px;inset-inline:10px;width:auto;height:44vh}
  .anio{inset-block-start:128px;inset-inline-end:14px}
  .leym{display:none}.tiempo{padding:8px 12px 12px}
  .maplibregl-ctrl-top-right{display:none}.maplibregl-ctrl-bottom-left{left:8px;bottom:60px}
}
@media (prefers-reduced-motion:reduce){.rec .txt>*{animation:none}}
</style>
</head>
<body>
<div id="map" role="application" aria-label="Mapa de Chía y la Sabana"></div>

<header class="cab">
  <div><h1 id="t-title"></h1><p class="sub" id="t-sub"></p></div>
  <div class="acc">
    <div class="idi" id="idi" role="group" aria-label="Idioma">
      <button data-l="es">Español</button><button data-l="pt">Português</button><button data-l="fr">Français</button><button data-l="zh">中文</button><button data-l="ar">العربية</button>
    </div>
    <button class="pld" id="b-tour"></button>
    <button class="pld" id="b-src"></button>
  </div>
</header>

<div class="anio" aria-live="polite"><div class="n" id="anio-n"></div><div class="p" id="anio-p"></div><div class="l" id="anio-l"></div></div>

<aside class="lat">
  <nav class="caps" id="caps" role="tablist"></nav>
  <div class="cont" id="cont"></div>
</aside>

<div class="leym" id="leym"></div>

<footer class="tiempo">
  <button class="bt" id="b-play" aria-label="Reproducir">▶</button>
  <div class="pista"><div class="marcas" id="marcas"></div><input type="range" id="sl" min="0" max="1000" value="1000" step="1" aria-label="Año"></div>
</footer>

<div class="rec" id="rec"><div class="vel"></div><div class="txt" id="rec-txt"></div>
  <div class="ctl"><button class="pld" id="rec-pausa"></button><button class="pld" id="rec-rep"></button><button class="pld" id="rec-fin"></button></div>
  <div class="bar"><i id="rec-bar"></i></div></div>

<div class="modal" id="modal"><div class="caja" id="caja"></div></div>

<script src="vendor/maplibre-gl.js"></script>
<script src="datos/datos.js?v=6"></script>
<script src="contenido/es.js?v=6"></script><script src="contenido/pt.js?v=6"></script><script src="contenido/fr.js?v=6"></script><script src="contenido/zh.js?v=6"></script><script src="contenido/ar.js?v=6"></script>
<script src="app.js?v=6"></script>
</body>
</html>
